name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx --no-install tsc --noEmit

      - name: Test
        run: npm test

      - name: Test security audit policy
        run: npm run test:security

      - name: Audit dependencies
        run: npm run audit:security

      - name: Verify overridden dependency compatibility
        run: npm run test:dependencies

      - name: Setup Java for isolated Firestore SDK check
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Verify Firebase Admin Firestore compatibility
        timeout-minutes: 10
        run: npx --yes --package=firebase-tools@15.17.0 firebase emulators:exec --only firestore --project demo-tennis-matchup-security --config scripts/firebase-smoke.config.json "node scripts/firebase-security-smoke.mjs"

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e -- --workers=1

      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: .security-audit/*.json
          if-no-files-found: ignore

      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
